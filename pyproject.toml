[project]
name = "eon-human-support"
version = "0.1.0"
description = "Eon — AI companion for emotional support"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",

    # DI
    "dishka>=1.3",

    # Messaging & tasks
    "faststream[redis]>=0.5",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Crypto
    "cryptography>=42.0",

    # AI
    "anthropic>=0.28",
    "openai>=1.35",

    # HTTP client
    "httpx>=0.27",

    # Email (Resend) + webhook signature verification
    "svix>=1.0",

    # Utils
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-env>=1.1",
    "ruff>=0.4",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
