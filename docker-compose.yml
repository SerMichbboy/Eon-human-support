services:

  postgres:
    image: ankane/pgvector:latest
    container_name: eon-postgres
    environment:
      POSTGRES_USER: eon
      POSTGRES_PASSWORD: eon
      POSTGRES_DB: eon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eon -d eon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eon-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    container_name: eon-migrate
    environment:
      DATABASE_URL_SYNC: postgresql://eon:eon@postgres:5432/eon
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: eon-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eon:eon@postgres:5432/eon
      DATABASE_URL_SYNC: postgresql://eon:eon@postgres:5432/eon
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: eon-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eon:eon@postgres:5432/eon
      DATABASE_URL_SYNC: postgresql://eon:eon@postgres:5432/eon
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: eon-scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eon:eon@postgres:5432/eon
      DATABASE_URL_SYNC: postgresql://eon:eon@postgres:5432/eon
      REDIS_URL: redis://redis:6379/0
    command: ["taskiq", "scheduler", "src.infrastructure.tasks.broker:scheduler", "--fs-discover", "--tasks-pattern", "src/infrastructure/tasks/*.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
